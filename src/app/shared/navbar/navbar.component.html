<nav class="sticky top-0 z-50 px-4 py-4 transition-all duration-500">
    <div class="container mx-auto">
        <div class="glass-panel px-6 md:px-8 py-3 flex justify-between items-center bg-white/70 dark:bg-gray-900/70 border-white/20 dark:border-white/10 shadow-lg shadow-blue-500/5 backdrop-blur-xl">
            <!-- Logo -->
            <div class="flex items-center">
                <a routerLink="/" class="flex items-center group">
                    <span class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:rotate-12 transition-transform duration-300">
                        <i class="fas fa-feather-alt text-xl"></i>
                    </span>
                    <span class="ml-3 font-heading font-bold text-2xl bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent hidden sm:block">
                        SmartNote
                    </span>
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-2">
                <!-- Theme Toggle -->
                <button (click)="toggleTheme()" 
                    class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-blue-500/10 dark:hover:bg-blue-500/20 text-gray-600 dark:text-gray-300 transition-colors">
                    <i class="fas" [ngClass]="themeService.currentTheme() === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                </button>

                <div class="h-6 w-[1px] bg-gray-200 dark:bg-gray-700 mx-2"></div>

                @if (isLoggedIn()) {
                    <a routerLink="/notes" routerLinkActive="text-blue-600 bg-blue-50 dark:bg-blue-900/30" 
                        class="px-4 py-2 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300 hover:text-blue-600 transition-all flex items-center">
                        <i class="fas fa-th-large mr-2"></i> Dashboard
                    </a>
                    <a routerLink="/new-note" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-500/25 transition-all hover:-translate-y-0.5 active:scale-95 flex items-center">
                        <i class="fas fa-plus mr-2"></i> New Note
                    </a>
                    
                    <!-- Profile Mockup for Premium UI -->
                    <div class="ml-2 w-10 h-10 rounded-xl bg-gradient-to-br from-blue-400 to-purple-400 border-2 border-white dark:border-gray-800 shadow-sm cursor-pointer hover:scale-110 transition-transform flex items-center justify-center text-white font-bold" (click)="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </div>
                } @else {
                    <a routerLink="/login" class="px-4 py-2 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300 hover:text-blue-600 transition-colors">
                        Sign In
                    </a>
                    <a routerLink="/register" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-500/25 transition-all hover:-translate-y-0.5 active:scale-95">
                        Get Started
                    </a>
                }
            </div>
            
            <!-- Mobile Controls -->
            <div class="md:hidden flex items-center gap-3">
                <button (click)="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-500/5 text-gray-600 dark:text-gray-300">
                    <i class="fas" [ngClass]="themeService.currentTheme() === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                </button>
                <button (click)="toggleMobileMenu()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-500/20">
                    <i class="fas" [ngClass]="showMobileMenu() ? 'fa-times' : 'fa-bars'"></i>
                </button>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        @if (showMobileMenu()) {
        <div class="md:hidden mt-3 glass-panel p-4 flex flex-col gap-2 bg-white/90 dark:bg-gray-900/90 animate-in slide-in-from-top-4 duration-300">
            @if (isLoggedIn()) {
                <a routerLink="/notes" (click)="toggleMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-blue-500/10 text-gray-700 dark:text-gray-300 font-bold flex items-center">
                    <i class="fas fa-th-large mr-3 text-blue-600"></i> My Dashboard
                </a>
                <a routerLink="/new-note" (click)="toggleMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-blue-500/10 text-gray-700 dark:text-gray-300 font-bold flex items-center">
                    <i class="fas fa-plus mr-3 text-blue-600"></i> Create Note
                </a>
                <button (click)="logout(); toggleMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-red-500/10 text-red-600 font-bold flex items-center text-left">
                    <i class="fas fa-sign-out-alt mr-3"></i> Log Out
                </button>
            } @else {
                <a routerLink="/login" (click)="toggleMobileMenu()" class="px-4 py-3 rounded-xl hover:bg-blue-500/10 text-gray-700 dark:text-gray-300 font-bold">
                    Sign In
                </a>
                <a routerLink="/register" (click)="toggleMobileMenu()" class="px-4 py-3 bg-blue-600 text-white rounded-xl font-bold text-center">
                    Get Started
                </a>
            }
        </div>
        }
    </div>
</nav>
